<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" preserveAspectRatio="none" role="img" aria-labelledby="creek-title">
<title id="creek-title">Paper creek with three stepping stones</title>
<desc>A shallow slate-blue stream rising gently from left to right, edged with narrow moss paper, small reeds, restrained cream current marks and three large grey stepping stones. The surrounding area is transparent.</desc>
